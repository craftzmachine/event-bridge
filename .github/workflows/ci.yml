# Type-check, test and build every push and pull request to main.
# Add it as a required check in Vercel (Deployment Checks) or GitHub branch protection so a red run stops the deploy.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npx tsc -b
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
